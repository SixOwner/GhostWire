<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141820" />
      <stop offset="100%" stop-color="#0D0F12" />
    </radialGradient>
    
    <!-- Violet Core Glow -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#8A2BE2" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#0D0F12" stop-opacity="0" />
    </radialGradient>

    <!-- Shield Interior Gradient -->
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0.15" />
    </linearGradient>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Dark Cyber Squircle Canvas (#0D0F12) -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Background Grid -->
  <path d="M64 160 H448 M64 352 H448 M160 64 V448 M352 64 V448" stroke="#00E5FF" stroke-opacity="0.04" stroke-width="2" />

  <!-- Violet Halo Outer Glow -->
  <circle cx="256" cy="256" r="200" fill="url(#haloGlow)" />

  <!-- Outer Shield Ambient Glow -->
  <path d="M256 110 C325 110 380 150 380 220 C380 320 256 400 256 400 C256 400 132 320 132 220 C132 150 187 110 256 110 Z"
        fill="url(#shieldFill)" stroke="#8A2BE2" stroke-width="12" stroke-opacity="0.4" />

  <!-- Luminescent Shield Main Perimeter (#00E5FF) -->
  <path d="M256 120 C320 120 370 155 370 215 C370 310 256 390 256 390 C256 390 142 310 142 215 C142 155 192 120 256 120 Z"
        fill="none" stroke="#00E5FF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)" />

  <!-- Geometric Circuit Spine -->
  <line x1="256" y1="150" x2="256" y2="330" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" />

  <!-- Horizontal Circuit Traces -->
  <path d="M256 210 H195 L175 230" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M256 210 H317 L337 230" stroke="#00E5FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Diagonal Circuit Traces (Violet) -->
  <path d="M256 275 H210 L190 295" stroke="#8A2BE2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M256 275 H302 L322 295" stroke="#8A2BE2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Luminescent Circuit Nodes -->
  <circle cx="256" cy="150" r="8" fill="#FFFFFF" />
  <circle cx="256" cy="210" r="9" fill="#00E5FF" />
  <circle cx="175" cy="230" r="7" fill="#00E5FF" />
  <circle cx="337" cy="230" r="7" fill="#00E5FF" />
  <circle cx="256" cy="330" r="8" fill="#00E5FF" />
  <circle cx="190" cy="295" r="6" fill="#8A2BE2" />
  <circle cx="322" cy="295" r="6" fill="#8A2BE2" />
</svg>
